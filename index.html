<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Drive sync is opt-in, so these only warm the handshake for users who
         reach for it; neither host is contacted until sign-in. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    
    <!-- Primary Meta Tags -->
    <title>GB Energy Meter — Visualize Green Button Energy Data</title>
    <meta name="title" content="GB Energy Meter — Visualize Green Button Energy Data" />
    <meta name="description" content="Free tool to analyze your home energy consumption from Green Button XML files. Interactive charts, cost tracking, weather correlation, and privacy-focused local processing." />
    <meta name="keywords" content="Green Button, energy meter, electricity usage, energy consumption, utility data, energy visualization, power usage tracker, home energy analysis" />
    <meta name="author" content="Jacob Krch" />
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "GB Energy Meter",
      "url": "https://gbmeter.com",
      "logo": "https://gbmeter.com/logo.png"
    }
    </script>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://gbmeter.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gbmeter.com/" />
    <meta property="og:title" content="GB Energy Meter — Visualize Green Button Energy Data" />
    <meta property="og:description" content="Free tool to analyze your home energy consumption. Interactive charts, cost tracking, and weather correlation, all processed locally in your browser." />
    <meta property="og:image" content="https://gbmeter.com/og-image.png" />
    <meta property="og:site_name" content="GB Energy Meter" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://gbmeter.com/" />
    <meta name="twitter:title" content="GB Energy Meter — Visualize Green Button Energy Data" />
    <meta name="twitter:description" content="Free tool to analyze your home energy consumption. Interactive charts, cost tracking, and weather correlation, all processed locally in your browser." />
    <meta name="twitter:image" content="https://gbmeter.com/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/plug.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "GB Energy Meter",
      "url": "https://gbmeter.com",
      "description": "Visualize and analyze energy consumption data from Green Button XML files with interactive charts, cost tracking, and weather correlation.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Green Button XML import",
        "Interactive consumption charts",
        "Cost tracking and analysis",
        "Weather data overlay",
        "Local browser processing"
      ]
    }
    </script>
    
    <!-- Analytics. Pinned with SRI: this is third-party code running on a page
         that holds a Google Drive token, so the browser refuses it unless the
         bytes are the ones reviewed here. Blocked analytics is harmless — the
         app never depends on it. Refresh the hash after upgrading Umami:
           curl -s https://analytics.jacobkrch.com/script.js | openssl dgst -sha384 -binary | openssl base64 -A
         The Content-Security-Policy is injected at build time; see vite.config.ts. -->
    <script defer src="https://analytics.jacobkrch.com/script.js"
      integrity="sha384-6PHtXKae10+dZuA/fcmjkSTDco+NPBE5fZ4eS/Em2lVIsS6FdDZIgs06MBJLEcSW"
      crossorigin="anonymous"
      data-website-id="1dd27276-2300-4ae2-8ba6-ecfab4ee4a38"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
